
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iconic Faces | Anime Universe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #04060d;
      --bg2: #0b1220;
      --accent: #ff4d6d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Space Grotesk", sans-serif;
      background: radial-gradient(circle at top, #0f172a, #05070d 70%);
      color: #fff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    button {
      font: inherit;
    }



    #videoLayer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #04060d;
    }

    #videoLayer video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.55s ease, filter 0.55s ease;
      filter: blur(8px) saturate(1.1);
    }

    #videoLayer video.active {
      opacity: 0.4;
    }

    

    .texture {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.035), transparent 35%),
        radial-gradient(circle at 80% 60%, rgba(255,180,200,.045), transparent 30%),
        linear-gradient(180deg, rgba(4,6,13,.15), rgba(4,6,13,.4));
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 1;
    }

    #petals {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
    }

    .petal {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 13px;
      background: rgba(255,180,200,.35);
      border-radius: 60% 40% 70% 30%;
      animation: fall linear infinite;
    }

    @keyframes fall {
      from {
        transform: translate3d(0, -5vh, 0) rotate(0deg);
      }

      to {
        transform: translate3d(60px, 110vh, 0) rotate(360deg);
      }
    }

    #cursorGlow {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,77,109,.22), transparent 70%);
      pointer-events: none;
      mix-blend-mode: screen;
      transform: translate(-50%, -50%);
      filter: blur(35px);
      z-index: 9;
      transition: background .4s ease;
    }



    main {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    .hero {
      position: absolute;
      top: 38px;
      left: 50%;
      width: min(90%, 700px);
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      animation: fadeDown 1.1s forwards;
      transition: opacity .35s ease;
      pointer-events: none;
      z-index: 1;
    }

    .hero h1 {
      font-family: "Zen Antique", serif;
      font-size: clamp(2.3rem, 5vw, 4.7rem);
      letter-spacing: 3px;
      background: linear-gradient(120deg, #fff, #ffb5c7, #d6b6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 100, 150, .14));
    }

    .hero p {
      opacity: .68;
      margin-top: 10px;
      font-size: .95rem;
      letter-spacing: .5px;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translate(-50%, -25px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

   

    #names {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .name {
      position: absolute;
      width: max-content;
      max-width: 220px;
      padding: 8px 11px;
      border: 1px solid transparent;
      border-radius: 14px;

      font-family: "Zen Antique", serif;
      font-size: clamp(1.15rem, 2vw, 2rem);
      line-height: 1.3;
      text-align: center;
      overflow-wrap: anywhere;

      color: rgba(255,255,255,.88);
      text-shadow: 0 0 16px rgba(255,255,255,.12);

      cursor: pointer;
      pointer-events: auto;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;

      transform: translate(-50%, -50%) rotate(var(--rot));
      animation: float 6s ease-in-out infinite;
      animation-delay: var(--delay);

      transition:
        color .3s ease,
        text-shadow .3s ease,
        background .3s ease,
        border-color .3s ease,
        opacity .3s ease;
    }

    .name:hover,
    .name.active {
      color: var(--color);
      text-shadow:
        0 0 12px var(--color),
        0 0 30px var(--color),
        0 0 55px var(--color);

      background: rgba(8, 12, 22, .55);
      border-color: var(--color);
      box-shadow: 0 0 24px color-mix(in srgb, var(--color) 12%, transparent);
      animation-play-state: paused;
      z-index: 5;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(-50%, -50%) rotate(var(--rot));
      }

      50% {
        transform: translate(-50%, calc(-50% - 8px)) rotate(var(--rot));
      }
    }

 

    body.name-focused .hero {
      opacity: 0 !important;
    }

    body.name-focused .name:not(.active) {
      opacity: 0;
      pointer-events: none;
    }

    body.name-focused .name.active {
      opacity: 1;
      pointer-events: auto;
    }

  

    #info {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: min(380px, calc(100vw - 40px));
      max-height: 42vh;
      overflow-y: auto;
      padding: 23px;

      border-radius: 22px;
      background: rgba(8,12,22,.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.1);

      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity .3s ease, transform .3s ease, border-color .3s ease;
      z-index: 6;
      pointer-events: none;
    }

    #info.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #info h2 {
      font-family: "Zen Antique", serif;
      font-size: 1.8rem;
      line-height: 1.25;
    }

    #info .series {
      color: #cbd5e1;
      margin: 8px 0 13px;
      font-size: .92rem;
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      margin-bottom: 12px;
      font-size: .85rem;
    }

    #desc {
      line-height: 1.65;
      color: rgba(255,255,255,.85);
      font-size: .94rem;
    }

  

    .controls {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 7;
      display: flex;
      gap: 10px;
    }

    button {
      color: #fff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 15px;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: background .25s ease, border-color .25s ease;
    }

    button:hover {
      background: rgba(255,255,255,.15);
      border-color: rgba(255,255,255,.3);
    }

    button:focus-visible,
    .name:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    /* ===== TABLET ===== */

    @media (max-width: 900px) {
      .name {
        max-width: 175px;
        padding: 6px 8px;
        font-size: clamp(1rem, 2.4vw, 1.6rem);
      }

      #info {
        width: min(340px, calc(100vw - 30px));
      }
    }

 

    @media (max-width: 600px) {
      .hero {
        top: 22px;
        width: 90%;
      }

      .hero h1 {
        font-size: clamp(2rem, 9vw, 3rem);
        letter-spacing: 1px;
      }

      .hero p {
        font-size: .78rem;
        margin-top: 5px;
      }

      .name {
        max-width: 44vw;
        padding: 5px 6px;
        font-size: clamp(.85rem, 3.5vw, 1.15rem);
        border-radius: 10px;
      }

      .controls {
        top: 12px;
        right: 12px;
      }

      .controls button {
        font-size: .72rem;
        padding: 8px 10px;
      }

      #info {
        left: 14px;
        bottom: 14px;
        width: calc(100% - 28px);
        max-height: 34vh;
        padding: 16px;
        border-radius: 17px;
      }

      #info h2 {
        font-size: 1.35rem;
      }

      #info .series {
        margin: 5px 0 9px;
      }

      #desc {
        font-size: .88rem;
        line-height: 1.5;
      }

      .badge {
        margin-bottom: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }

      #videoLayer video {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div id="videoLayer"></div>
  <div class="texture"></div>
  <div id="petals"></div>
  <div id="cursorGlow"></div>

  <main>
    <header class="hero">
      <h1>Iconic Faces</h1>
      <p>Hover or tap a name to awaken their world.</p>
    </header>

    <div id="names" aria-label="Anime characters"></div>

    <section id="info" aria-live="polite" aria-atomic="true">
      <h2 id="title"></h2>
      <div class="series" id="series"></div>
      <div class="badge" id="nick"></div>
      <p id="desc"></p>
    </section>

    <div class="controls">
      <button id="musicBtn" type="button" aria-pressed="false">
        ♫ Character Audio Off
      </button>
    </div>
  </main>

  <script>
  
    const characters = [
      {
        name: "Makima",
        series: "Chainsaw Man",
        nickname: "Control Devil",
        description: "A calm, hypnotic manipulator whose mysterious smile hides terrifying authority.",
        accent: "#ff3b5f",
        video: "videos/makima.mp4",
        x: 15, y: 19, size: "2.5rem", rot: "-8deg"
      },
      {
        name: "Mikasa Ackerman",
        series: "Attack on Titan",
        nickname: "The Strongest Soldier",
        description: "Silent, fiercely loyal, and one of humanity's deadliest warriors.",
        accent: "#d14b4b",
        video: "videos/mikasa.mp4",
        x: 70, y: 17, size: "2.2rem", rot: "6deg"
      },
      {
        name: "Yor Forger",
        series: "Spy x Family",
        nickname: "Thorn Princess",
        description: "An elegant assassin who balances extraordinary combat skills with a caring heart.",
        accent: "#ff4568",
        video: "videos/yor.mp4",
        x: 12, y: 40, size: "2.2rem", rot: "-6deg"
      },
      {
        name: "Shinobu Kocho",
        series: "Demon Slayer",
        nickname: "Insect Hashira",
        description: "A graceful and sharp-witted swordswoman whose butterfly-like elegance hides formidable skill.",
        accent: "#bd8cff",
        video: "videos/shinobu.mp4",
        x: 84, y: 31, size: "2.1rem", rot: "5deg"
      },
      {
        name: "Mitsuri Kanroji",
        series: "Demon Slayer",
        nickname: "Love Hashira",
        description: "A warm-hearted and powerful swordswoman who leads with compassion and courage.",
        accent: "#ff8fc8",
        video: "videos/mitsuri.mp4",
        x: 17, y: 76, size: "2.1rem", rot: "4deg"
      },
      {
        name: "Marin Kitagawa",
        series: "My Dress-Up Darling",
        nickname: "The Cosplay Queen",
        description: "A cheerful, confident anime enthusiast whose passion for cosplay and love for self-expression make her unforgettable.",
        accent: "#ff8fb8",
        video: "videos/marin.mp4",
        x: 80, y: 68, size: "2rem", rot: "-4deg"
      },
      {
        name: "Roronoa Zoro",
        series: "One Piece",
        nickname: "King of Hell",
        description: "A relentless swordsman whose ambition and three-sword style make every edit legendary.",
        accent: "#35e0a1",
        video: "videos/zoro.mp4",
        x: 50, y: 85, size: "2.4rem", rot: "-3deg"
      },
      {
        name: "Nico Robin",
        series: "One Piece",
        nickname: "Devil Child",
        description: "An elegant archaeologist whose quiet intellect hides immense emotional depth.",
        accent: "#9b5cff",
        video: "videos/robin.mp4",
        x: 29, y: 61, size: "2.3rem", rot: "-5deg"
      },
      {
        name: "Hinata Hyuga",
        series: "Naruto",
        nickname: "The Sunflower Princess",
        description: "Gentle yet courageous, she grows into one of the Hidden Leaf's brightest spirits.",
        accent: "#b993ff",
        video: "videos/hinata.mp4",
        x: 73, y: 49, size: "2rem", rot: "8deg"
      },
      {
        name: "Waguri",
        series: "Oshi no Ko",
        nickname: "Golden Blossom",
        description: "A graceful presence whose warmth and quiet charm leave a lasting impression.",
        accent: "#ff8fb8",
        video: "videos/waguri.mp4",
        x: 47, y: 36, size: "2.6rem", rot: "-2deg"
      }
    ];



    const names = document.getElementById("names");
    const panel = document.getElementById("info");
    const title = document.getElementById("title");
    const series = document.getElementById("series");
    const nick = document.getElementById("nick");
    const desc = document.getElementById("desc");
    const cursor = document.getElementById("cursorGlow");
    const videoLayer = document.getElementById("videoLayer");
    const musicBtn = document.getElementById("musicBtn");

    const nameElements = [];
    const characterElements = new Map();

    let activeVideo = null;
    let selectedCharacter = null;
    let previewCharacter = null;
    let characterAudioOn = false;



    function layoutNames() {
      const mobile = window.innerWidth <= 600;
      const tablet = window.innerWidth <= 900;

      const desktopPositions = [
        [15, 19],
        [70, 17],
        [12, 40],
        [84, 31],
        [17, 76],
        [80, 68],
        [50, 85],
        [29, 61],
        [73, 49],
        [47, 36]
      ];

      const tabletPositions = [
        [18, 17],
        [72, 17],
        [17, 34],
        [80, 32],
        [19, 73],
        [79, 69],
        [51, 84],
        [29, 57],
        [74, 49],
        [49, 36]
      ];

      const mobilePositions = [
        [25, 15],
        [75, 15],
        [25, 26],
        [75, 26],
        [25, 37],
        [75, 37],
        [25, 48],
        [75, 48],
        [25, 59],
        [75, 59]
      ];

      const positions = mobile
        ? mobilePositions
        : tablet
          ? tabletPositions
          : desktopPositions;

      nameElements.forEach((el, i) => {
        const [x, y] = positions[i];
        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
      });
    }


    function stopActiveVideo() {
      if (activeVideo) {
        activeVideo.classList.remove("active");
        activeVideo.pause();
        activeVideo = null;
      }
    }

    function showCharacter(character, element) {
      document.querySelectorAll(".name").forEach(el => {
        el.classList.toggle("active", el === element);
      });

      document.body.classList.add("name-focused");

      document.documentElement.style.setProperty(
        "--accent",
        character.accent
      );

      cursor.style.background =
        `radial-gradient(circle, ${character.accent}44, transparent 70%)`;

      title.textContent = character.name;
      series.textContent = character.series;
      nick.textContent = character.nickname;
      desc.textContent = character.description;

      panel.style.borderColor = `${character.accent}77`;
      panel.classList.add("show");

      if (activeVideo !== characterElements.get(character).video) {
        stopActiveVideo();

        const video = characterElements.get(character).video;

        if (video) {
          activeVideo = video;
          video.classList.add("active");
          video.muted = !characterAudioOn;

          video.play().catch(() => {
          
          });
        }
      } else if (activeVideo) {
        activeVideo.muted = !characterAudioOn;
      }
    }

    function clearCharacter() {
      selectedCharacter = null;
      previewCharacter = null;

      document.querySelectorAll(".name").forEach(el => {
        el.classList.remove("active");
      });

      document.body.classList.remove("name-focused");
      panel.classList.remove("show");

      cursor.style.background =
        "radial-gradient(circle, rgba(255,77,109,.22), transparent 70%)";

      stopActiveVideo();
    }

    function preview(c, el) {
      if (selectedCharacter) return;

      previewCharacter = c;
      showCharacter(c, el);
    }



    characters.forEach((c, i) => {
      const el = document.createElement("div");

      el.className = "name";
      el.textContent = c.name;
      el.style.fontSize = c.size;
      el.style.setProperty("--rot", c.rot);
      el.style.setProperty("--color", c.accent);
      el.style.setProperty("--delay", `${i * -0.35}s`);
      el.setAttribute("role", "button");
      el.setAttribute("tabindex", "0");
      el.setAttribute("aria-label", `Explore ${c.name}`);
      el.setAttribute("aria-pressed", "false");

      names.appendChild(el);
      nameElements.push(el);

      let vid = null;

      if (c.video) {
        vid = document.createElement("video");
        vid.src = c.video;
        vid.loop = true;
        vid.muted = true;
        vid.volume = 0.72;
        vid.preload = "none";
        vid.playsInline = true;
        vid.setAttribute("playsinline", "");
        vid.setAttribute("aria-hidden", "true");

        videoLayer.appendChild(vid);
      }

      characterElements.set(c, { element: el, video: vid });

      el.addEventListener("mouseenter", () => {
        preview(c, el);
      });

      el.addEventListener("mouseleave", () => {
        if (!selectedCharacter && previewCharacter === c) {
          clearCharacter();
        }
      });

      el.addEventListener("focus", () => {
        preview(c, el);
      });

      el.addEventListener("blur", () => {
        if (!selectedCharacter && previewCharacter === c) {
          clearCharacter();
        }
      });

      el.addEventListener("click", e => {
        e.stopPropagation();

        selectedCharacter = c;
        previewCharacter = null;

        document.querySelectorAll(".name").forEach(n => {
          n.setAttribute("aria-pressed", String(n === el));
        });

        showCharacter(c, el);
      });

      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          el.click();
        }
      });
    });


    layoutNames();

    window.addEventListener("resize", layoutNames);

  

    document.addEventListener("click", e => {
      if (
        !e.target.closest(".name") &&
        !e.target.closest("#info") &&
        !e.target.closest(".controls")
      ) {
        clearCharacter();
      }
    });

  

    document.addEventListener("pointermove", e => {
      if (e.pointerType === "touch") return;

      cursor.style.left = `${e.clientX}px`;
      cursor.style.top = `${e.clientY}px`;
    });

    if (window.matchMedia("(pointer: coarse)").matches) {
      cursor.style.display = "none";
    }


    const petals = document.getElementById("petals");

    for (let i = 0; i < 42; i++) {
      const p = document.createElement("div");

      p.className = "petal";
      p.style.left = `${Math.random() * 100}%`;
      p.style.animationDuration = `${10 + Math.random() * 12}s`;
      p.style.animationDelay = `${Math.random() * -20}s`;
      p.style.opacity = 0.2 + Math.random() * 0.5;

      petals.appendChild(p);
    }


    musicBtn.addEventListener("click", e => {
      e.stopPropagation();

      characterAudioOn = !characterAudioOn;

      musicBtn.textContent = characterAudioOn
        ? "♫ Character Audio On"
        : "♫ Character Audio Off";

      musicBtn.setAttribute(
        "aria-pressed",
        String(characterAudioOn)
      );

      if (activeVideo) {
        activeVideo.muted = !characterAudioOn;

        if (characterAudioOn) {
          activeVideo.play().catch(() => {});
        }
      }
    });
  </script>
</body>
</html>
