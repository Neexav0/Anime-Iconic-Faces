<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iconic Faces | Anime Universe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>
  <div id="videoLayer"></div>
  <div class="texture"></div>
  <div id="petals"></div>
  <div id="cursorGlow"></div>

  <main>
    <header class="hero">
      <h1>Iconic Faces</h1>
      <p>Hover or tap a name to awaken their world.</p>
    </header>

    <div id="names" aria-label="Anime characters"></div>

    <section id="info" aria-live="polite" aria-atomic="true">
      <h2 id="title"></h2>
      <div class="series" id="series"></div>
      <div class="badge" id="nick"></div>
      <p id="desc"></p>
    </section>

    <div class="controls">
      <button id="musicBtn" type="button" aria-pressed="false">
        ♫ Character Audio Off
      </button>
    </div>
  </main>

    <script src="js/script.js" defer></script>
</body>
</html>
